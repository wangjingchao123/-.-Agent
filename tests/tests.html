<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>银龄安动 - 自动化测试</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; padding: 20px; font-size: 16px; background: #f6f8fb; }
    h1 { font-size: 22px; }
    #test-summary { font-size: 24px; font-weight: bold; padding: 12px 16px; border: 2px solid; border-radius: 8px; margin-bottom: 16px; }
    #test-summary.pass { color: #2e7d32; border-color: #2e7d32; background: #e8f5e9; }
    #test-summary.fail { color: #c62828; border-color: #c62828; background: #ffebee; }
    .case { padding: 6px 10px; border-bottom: 1px solid #e0e0e0; }
    .case.pass { color: #2e7d32; }
    .case.fail { color: #c62828; font-weight: bold; }
    .case .msg { color: #c62828; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>银龄安动 - 自动化测试</h1>
  <div id="test-summary">运行中…</div>
  <div id="test-list"></div>
  <div id="test-result-marker" hidden>RESULT:PENDING</div>

  <script>
    /* ---------- 极简测试框架 ---------- */
    window.SATest = {
      tests: [],
      assert: function (cond, msg) { if (!cond) throw new Error(msg || '断言失败'); },
      assertEqual: function (actual, expected, msg) {
        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
          throw new Error((msg || '不相等') + '（期望 ' + JSON.stringify(expected) + '，实际 ' + JSON.stringify(actual) + '）');
        }
      },
      test: function (name, fn) { SATest.tests.push({ name: name, run: fn, async: false }); },
      testAsync: function (name, fn) { SATest.tests.push({ name: name, run: fn, async: true }); }
    };
  </script>

  <script src="../js/voice.js"></script>
  <script src="../js/health.js"></script>
  <script src="../js/planner.js"></script>
  <script src="../js/pose.js"></script>
  <script src="../js/train.js"></script>
  <script src="test-voice.js"></script>
  <script src="test-health.js"></script>
  <script src="test-planner.js"></script>
  <script src="test-pose.js"></script>
  <script src="test-train.js"></script>

  <script>
    (function () {
      var passed = 0, failed = 0;
      var listEl = document.getElementById('test-list');
      function renderCase(t, err) {
        var div = document.createElement('div');
        div.className = 'case ' + (err ? 'fail' : 'pass');
        div.textContent = (err ? '✗ ' : '✓ ') + t.name + (err ? ' —— ' + err.message : '');
        listEl.appendChild(div);
      }
      function finish() {
        var total = SATest.tests.length;
        var sum = document.getElementById('test-summary');
        var marker = document.getElementById('test-result-marker');
        if (failed === 0) {
          sum.textContent = '全部通过：' + passed + ' / ' + total;
          sum.className = 'pass';
          marker.textContent = 'RESULT:PASS';
        } else {
          sum.textContent = '存在失败：通过 ' + passed + ' / ' + total;
          sum.className = 'fail';
          marker.textContent = 'RESULT:FAIL';
        }
        console.log('[测试] RESULT:' + (failed === 0 ? 'PASS' : 'FAIL') + ' ' + passed + '/' + total);
      }
      var idx = 0;
      function runNext() {
        if (idx >= SATest.tests.length) { finish(); return; }
        var t = SATest.tests[idx++];
        Promise.resolve()
          .then(function () { return t.run(); })
          .then(function () { passed++; renderCase(t, null); })
          .catch(function (err) { failed++; renderCase(t, err); })
          .then(runNext);
      }
      runNext();
    })();
  </script>
</body>
</html>
